name: Deploy bisats-frontend (S3 + CloudFront)

on:
  push:
    branches:
      - main        
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Security gate — runs before any build starts.
  # Catches secrets, bad code patterns, and console.logs.
  # ───────────────────────────────────────────────────────────
  security-scan:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Frontend console.log scan — scans frontend/src specifically
    #  - name: Scan for console.log
    #    run: |
    #      echo "Scanning for rogue console.log statements..."
    #      if grep -rnw 'frontend/src/' -e 'console\.log'; then
    #        echo "SECURITY VIOLATION: console.log found. Deployment stopped."
    #        exit 1
    #      fi
    #      echo "Clean. No console.log found."

      # Gitleaks — catches hardcoded API keys, tokens, secrets.
      # Especially important here because REACT_APP_ env vars get
      # baked into the JS bundle at build time — if someone hardcodes
      # one instead of using the secret, it ships to every user's browser.
      - name: Gitleaks secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --redact \
            --no-git \
            --verbose \
            --exit-code 1

      # Semgrep — React and JS specific rulesets.
      # Catches: dangerouslySetInnerHTML XSS, hardcoded secrets in JSX,
      # insecure fetch usage, exposed sensitive data in component state.
      - name: Semgrep SAST scan
        run: |
          pipx install semgrep
          semgrep ci \
            --config "p/javascript" \
            --config "p/react" \
            --config "p/secrets"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Download Trivy HTML Template
        run: wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'template'
          template: '@html.tpl' 
          output: 'trivy-security-report.html'
          severity: 'CRITICAL,HIGH'

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: frontend-security-report
          path: trivy-security-report.html    
     

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build and deploy — only runs if security gate passes.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_NODE_ENV: production
          REACT_APP_DEV_DOMAIN: ${{ secrets.REACT_APP_DEV_DOMAIN }}
          REACT_APP_GOOGLE_API_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_API_CLIENT_ID }}
          REACT_APP_REDUX_SECRET: ${{ secrets.REACT_APP_REDUX_SECRET }}
          REACT_APP_TAWK_URL: ${{ secrets.REACT_APP_TAWK_URL }}
          REACT_APP_ZOHO_URL: ${{ secrets.REACT_APP_ZOHO_URL }}
          REACT_APP_AUTH_HEADER_SECRET: ${{ secrets.REACT_APP_AUTH_HEADER_SECRET }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync frontend/build s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Remove .DS_Store from S3
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }} \
            --recursive \
            --exclude "*" \
            --include ".DS_Store"

      - name: CloudFront cache invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"