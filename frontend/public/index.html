<html lang="en">
  <head>
    <script>
      try {
        const storedTheme = localStorage.getItem("bisats-ui-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (
          storedTheme === '"dark"' ||
          storedTheme === "dark" ||
          ((!storedTheme || storedTheme === "system" || storedTheme === '"system"') && prefersDark)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
